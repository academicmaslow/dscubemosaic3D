const scene = new THREE.Scene();

renderer.setSize(innerWidth, innerHeight);

  for (const t of [0, 1, 2, 0, 2, 3]) { pos.push(...q.v[t]); col.push(...q.c); }

function makeOrtho() {
  const half = FR / 2;
  let h = half, w = half * (innerWidth / innerHeight);
  if (w < half) { w = half; h = half / (innerWidth / innerHeight); }
  return new THREE.OrthographicCamera(-w, w, h, -h, 0.1, 5000);
}

  activeCam = cam;

  controls = new THREE.OrbitControls(activeCam, renderer.domElement);
  controls.target.set(TARGET[0], TARGET[1], TARGET[2]);

  if (ortho) {
    const cam = makeOrtho();
    const d = 2000;
    cam.position.set(TARGET[0] + view[0] * d, TARGET[1] + view[1] * d, TARGET[2] + view[2] * d);

    cam.lookAt(TARGET[0], TARGET[1], TARGET[2]);
    setCamera(cam);

    perspCam.position.set(TARGET[0] + view[0] * d, TARGET[1] + view[1] * d, TARGET[2] + view[2] * d);

    perspCam.lookAt(TARGET[0], TARGET[1], TARGET[2]);
    setCamera(perspCam);
